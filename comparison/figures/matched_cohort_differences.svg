  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465568" transform="translate(32.76 418.678594)">Each row uses the same available core-country cohort for model and comparator. Cohorts differ between rows.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465568" transform="translate(32.76 430.808203)">TEMPO 2020 is an inherited identity and is excluded. Blue rows are conditional area equivalents; green is an existing converted proxy.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465568" transform="translate(32.76 442.937813)">These datasets share inputs and conversion assumptions. The chart does not rank model accuracy.</text>
  </g>
