   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="32.76" y="20.757656" transform="rotate(-0 32.76 20.757656)">Cross-dataset gaps: global cancellation and country variation</text>
